runtime:
  mode: stationary_hil
sources:
  thermal: real_mlx90640
  camera: real_camera_array
  motors: log_only

device_bus:
  enabled: true
  dir_name: device_bus
  run_mode: real_sensors_log_only_motors

startup:
  enabled: true
  abort_on_failure: true
  allow_degraded_mode: false
  require_devices:
    - thermal
    - camera_array
    - motors
    - vision_model
    - safety
  require_emergency_stop_clear: true
  emergency_stop_clear: true

sensors:
  thermal:
    model: mlx90640
    i2c_bus: 1
    i2c_frequency: 400000
    resolution_w: 32
    resolution_h: 24
    max_range_m: 4.0
    fov_deg: 55
    fov_x_deg: 55
    fov_y_deg: 35
    threshold_delta_c: 0.35
    min_blob_pixels: 4
  camera:
    camera_ids:
      - front
      - left
      - right
    require_all_cameras: false
    width: 640
    height: 480
    frame_width: 640
    frame_height: 480
    fps: 10
    front_device: 0
    left_device: 1
    right_device: 2
mission:
  hil_steps: 5
  thermal_min_confidence: 0.12
  vision_min_confidence: 0.50
  verify_distance_m: 0.75
vision_model:
  type: mock
logging:
  base_output_dir: outputs/hardware_bringup
